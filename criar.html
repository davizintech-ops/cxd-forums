<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Criar tópico — CXD</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>CXD</span></a><nav class="desktop-nav"><a href="index.html"><svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3zM9 20v-6h6v6"/></svg><span>Início</span></a><a href="populares.html"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-7"/></svg><span>Popular</span></a><a class="active" href="criar.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Criar</span></a><a href="config.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg><span>Ajustes</span></a><a href="perfil.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg><span>Perfil</span></a></nav><a href="login.html" class="button secondary"><svg class="icon" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M11 8l4 4-4 4M15 12H3"/></svg>Entrar</a></div></header><main><div style="max-width:760px;margin:auto"><section class="hero reveal"><div><span class="eyebrow">Abrir uma conversa</span><h1>Conte o que<br><span>você descobriu.</span></h1><p>Uma boa pergunta não precisa estar pronta. Basta começar com o contexto certo.</p></div></section><section class="card reveal"><div class="field"><label for="titulo">Título do tópico</label><input id="titulo" placeholder="Ex.: Como vocês organizam um projeto grande?" maxlength="120"></div><div class="field"><label for="texto">Mensagem</label><textarea id="texto" placeholder="Escreva sua mensagem com contexto, dúvidas e detalhes…" rows="8"></textarea></div><div class="field"><label for="imagem">Adicionar uma imagem <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input type="file" id="imagem" accept="image/*"><img id="preview" class="preview" alt="Prévia da imagem selecionada"></div><div class="form-actions"><button onclick="criarPost()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Publicar conversa</button><a class="button secondary" href="index.html">Cancelar</a></div></section></div></main><nav class="bottom-nav"><a href="index.html"><svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3zM9 20v-6h6v6"/></svg><span>Início</span></a><a href="populares.html"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-7"/></svg><span>Popular</span></a><a class="active" create-action href="criar.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Criar</span></a><a href="config.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg><span>Ajustes</span></a><a href="perfil.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg><span>Perfil</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="forum.js"></script><script>document.getElementById('imagem').addEventListener('change',function(){const file=this.files[0],preview=document.getElementById('preview');if(!file){preview.style.display='none';return}const reader=new FileReader();reader.onload=e=>{preview.src=e.target.result;preview.style.display='block'};reader.readAsDataURL(file)});</script></body></html>
