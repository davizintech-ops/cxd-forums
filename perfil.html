><button onclick="salvarFoto()">Salvar foto</button><button class="secondary" onclick="logout()">Sair da conta</button></div></section></div></main><nav class="bottom-nav"><a href="index.html"><svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9H3zM9 20v-6h6v6"/></svg><span>Início</span></a><a href="populares.html"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-7"/></svg><span>Popular</span></a><a create-action href="criar.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Criar</span></a><a href="config.html"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/></svg><span>Ajustes</span></a><a class="active" href="perfil.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.8-3.2 3.1-5 7-5s6.2 1.8 7 5"/></svg><span>Perfil</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script><script>const usuario=JSON.parse(localStorage.getItem('usuario')||'null');if(usuario)document.getElementById('nomePerfil').textContent=usuario.nome;const fotoSalva=localStorage.getItem('fotoPerfil');if(fotoSalva)document.getElementById('fotoPerfil').src=fotoSalva;document.getElementById('status').textContent=localStorage.getItem('logado')?'Online':'Offline';function salvarFoto(){const a=document.getElementById('foto').files[0];if(!a){alert('Escolha uma foto primeiro.');return}const r=new FileReader();r.onload=e=>{localStorage.setItem('fotoPerfil',e.target.result);document.getElementById('fotoPerfil').src=e.target.result;alert('Foto salva!')};r.readAsDataURL(a)}</script></body></html>
